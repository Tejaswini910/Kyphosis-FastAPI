<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102d4c">
<title>Log in | Kyphosis Explorer</title>
<link rel="stylesheet" href="/static/reference-theme.css">
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<main class="auth-wrap">
<section class="panel auth-panel">
<a class="brand auth-brand" href="/login"><span class="brand-mark">K</span><span>Kyphosis Data Explorer</span></a>
<h1>Log in</h1>
<p class="auth-intro">Sign in to access the dashboard and application data.</p>
{% if error %}<p class="server-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="auth-label" for="username">Username</label>
<input class="auth-input" id="username" name="username" autocomplete="username" value="{{ username_hint or 'admin' }}" required>
<label class="auth-label" for="password">Password</label>
<input class="auth-input" id="password" name="password" type="password" autocomplete="current-password" required>
<button class="button auth-submit" type="submit">Log in</button>
</form>
<p class="auth-help">Use the account configured by the application administrator.</p>
</section>
</main>
</body>
</html>
